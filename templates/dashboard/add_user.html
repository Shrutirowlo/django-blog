{% extends "base.html" %} 
{% block content %}
{% load crispy_forms_tags%}
<div class="row">
  <!-- left sidebar -->
  {% include "dashboard/sidebar.html" %}

  <!-- Right side content -->
  <div class="col-md-9">
    {% if perms.auth.add_user %}
    <h2>Add User</h2>

    <form action="{% url 'add_user'%}" method = "POST" ">
        {% csrf_token %}
        {{form | crispy}}

        <button type="submit" class="btn btn-warning">Submit</button>
    </form>
    <br>
    {%else%}
      <span>You are not allowed to add the users</span>
    {%endif%}
  </div>
</div>

{% endblock %}
